name: synthetic_mri_gan

channels:
  - defaults
  - conda-forge

dependencies:
  - python=3.9
  - pip
  - numpy
  - matplotlib
  - scikit-image
  - jupyter
  - nibabel

  - pip:
      # Core ML/Data Processing Dependencies
      - tensorflow==2.10.0
      - numpy==1.23.5
      - scipy==1.9.3
      - opencv-python==4.6.0.66
      - nibabel==4.0.2
      - scikit-image==0.19.3
      - tqdm==4.64.1
      - imageio==2.22.4

      # Visualization and Jupyter Dependencies
      - matplotlib==3.6.3
      - notebook==6.5.4
      - jupyter_core==5.3.0
      - jupyter_client==7.4.9
      - jupyter_server==1.23.4
      - traitlets==5.9.0
      - ipykernel==6.22.0